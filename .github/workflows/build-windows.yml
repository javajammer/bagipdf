name: Build BagiPDF Executables & Packages (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          cd webapp
          npm ci --ignore-scripts

      - name: Build Standalone Executable (.exe & .msi)
        run: |
          cd webapp
          npm run dist:win

      - name: Upload BagiPDF Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BagiPDF-Windows-x64-v2.1.0
          path: |
            webapp/src-tauri/target/release/bundle/nsis/*.exe
            webapp/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: build-linux (${{ matrix.ubuntu-version }})
    runs-on: ${{ matrix.ubuntu-version }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend & Tauri Dependencies
        run: |
          cd webapp
          npm ci --ignore-scripts

      - name: Build Linux Binary & Packages (.deb & Executable)
        run: |
          cd webapp
          npm run build
          npx tauri build --target x86_64-unknown-linux-gnu

      - name: Upload BagiPDF Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BagiPDF-Linux-x86_64-${{ matrix.ubuntu-version }}-v2.1.0
          path: |
            webapp/src-tauri/target/x86_64-unknown-linux-gnu/release/bagipdf
            webapp/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            webapp/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            webapp/src-tauri/target/release/bagipdf
            webapp/src-tauri/target/release/bundle/deb/*.deb
            webapp/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn


