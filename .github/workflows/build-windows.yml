name: Build Windows Executable (BagiPDF)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Dependencies
        run: |
          cd webapp
          npm ci --ignore-scripts

      - name: Build Standalone Executable (.exe)
        run: |
          cd webapp
          npm run dist:win -- -c.npmRebuild=false

      - name: Upload BagiPDF Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BagiPDF-Windows-x64
          path: |
            dist_electron/BagiPDF-v*.exe
            webapp/dist_electron/BagiPDF-v*.exe
