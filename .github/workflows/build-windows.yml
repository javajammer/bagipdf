name: Build Windows Executable (BagiPDF)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: |
          cd webapp
          npm ci

      - name: Build Standalone Executable (.exe)
        run: |
          cd webapp
          npm run dist:win

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BagiPDF-Windows-x64
          path: dist_electron/BagiPDF-v*.exe
