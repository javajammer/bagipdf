name: Build Windows Executable (BagiPDF Rust & Tauri v2.0.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          cd webapp
          npm ci --ignore-scripts

      - name: Build Standalone Executable (.exe)
        run: |
          cd webapp
          npm run dist:win

      - name: Upload BagiPDF Executable & MSI Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BagiPDF-Windows-x64-v2.0.0
          path: |
            webapp/src-tauri/target/release/bundle/nsis/*.exe
            webapp/src-tauri/target/release/bundle/msi/*.msi
