[package]
name = "bagipdf"
version = "2.4.2"
description = "BagiPDF - High Performance Portable PDF Tool in Rust & Tauri"
authors = ["Muhammad Fahrizal Rahman"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.32"
rfd = "0.15"
open = "5.3"
reqwest = { version = "0.12", features = ["json"] }
sha2        = "0.10"
hmac        = "0.12"
hex         = "0.4"
base64      = "0.22"
chrono      = { version = "0.4", features = ["serde"] }
aes-gcm     = "0.10"
sysinfo     = "0.32"
mac_address = "1.1"
tokio       = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
native-tls  = "0.2"
postgres-native-tls = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
strip = true
