[package]
name = "bagipdf"
version = "2.0.0"
description = "BagiPDF - High Performance Portable PDF Tool in Rust & Tauri"
authors = ["Franky Setiawan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.32"
